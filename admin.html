<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 | 대한스킴보드협회</title>
  <link rel="icon" href="img/kska-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="css/admin.css?v=1">
</head>
<body>
  <!-- 로그인 -->
  <main class="auth" data-view="auth" hidden>
    <div class="auth__card">
      <img class="auth__logo" src="img/kska-logo.svg" alt="" width="88" height="75">
      <h1>관리자 로그인</h1>
      <p class="muted" data-auth-hint>관리자로 등록된 이메일로 로그인하세요.</p>

      <form class="form" data-form="login">
        <label class="field"><span>이메일</span><input type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>비밀번호</span><input type="password" name="password" autocomplete="current-password" required minlength="8"></label>
        <p class="form__error" data-error role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">로그인</button>
      </form>

      <form class="form" data-form="signup" hidden>
        <label class="field"><span>이메일</span><input type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>비밀번호 (8자 이상)</span><input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
        <p class="form__error" data-error role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">계정 만들기</button>
      </form>

      <form class="form" data-form="reset" hidden>
        <label class="field"><span>이메일</span><input type="email" name="email" autocomplete="email" required></label>
        <p class="form__error" data-error role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">재설정 메일 보내기</button>
      </form>

      <form class="form" data-form="newpass" hidden>
        <label class="field"><span>새 비밀번호 (8자 이상)</span><input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
        <p class="form__error" data-error role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">비밀번호 바꾸기</button>
      </form>

      <div class="auth__switch">
        <button type="button" data-switch="login" hidden>로그인으로 돌아가기</button>
        <button type="button" data-switch="signup">처음이라면 계정 만들기</button>
        <button type="button" data-switch="reset">비밀번호를 잊었어요</button>
      </div>
      <a class="auth__back" href="./"><i class="ph ph-arrow-left" aria-hidden="true"></i>홈페이지로</a>
    </div>
  </main>

  <!-- 권한 없음 -->
  <main class="auth" data-view="denied" hidden>
    <div class="auth__card">
      <img class="auth__logo" src="img/kska-logo.svg" alt="" width="88" height="75">
      <h1>관리자 권한이 없어요</h1>
      <p class="muted"><strong data-me></strong> 계정은 아직 관리자로 등록되지 않았어요. 기존 관리자에게 이 이메일을 관리자로 추가해 달라고 요청하세요.</p>
      <button class="btn btn--ghost btn--block" type="button" data-logout>로그아웃</button>
    </div>
  </main>

  <!-- 관리 화면 -->
  <div class="app" data-view="app" hidden>
    <header class="bar">
      <a class="bar__brand" href="./" target="_blank" rel="noopener">
        <img src="img/kska-logo.svg" alt="" width="36" height="31">
        <span>KSKA 관리자</span>
      </a>
      <nav class="tabs" role="tablist" aria-label="관리 메뉴">
        <button role="tab" type="button" data-tab="events" aria-selected="true"><i class="ph ph-calendar-blank" aria-hidden="true"></i>행사</button>
        <button role="tab" type="button" data-tab="notices"><i class="ph ph-megaphone" aria-hidden="true"></i>소식</button>
        <button role="tab" type="button" data-tab="gallery"><i class="ph ph-images" aria-hidden="true"></i>갤러리</button>
        <button role="tab" type="button" data-tab="sponsors"><i class="ph ph-handshake" aria-hidden="true"></i>스폰서</button>
        <button role="tab" type="button" data-tab="settings"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i>기본 정보</button>
        <button role="tab" type="button" data-tab="admins"><i class="ph ph-user-gear" aria-hidden="true"></i>관리자</button>
      </nav>
      <div class="bar__me">
        <a class="btn btn--ghost btn--sm" href="./" target="_blank" rel="noopener"><i class="ph ph-arrow-square-out" aria-hidden="true"></i>사이트 보기</a>
        <button class="btn btn--ghost btn--sm" type="button" data-logout>로그아웃</button>
      </div>
    </header>

    <main class="panel" data-panel></main>
  </div>

  <!-- 편집 창 -->
  <dialog class="sheet" data-sheet>
    <form class="sheet__inner form" data-sheet-form method="dialog" novalidate>
      <header class="sheet__head">
        <h2 data-sheet-title>편집</h2>
        <button class="icon-btn" type="button" data-sheet-close aria-label="닫기"><i class="ph-bold ph-x" aria-hidden="true"></i></button>
      </header>
      <div class="sheet__body" data-sheet-body></div>
      <p class="form__error" data-sheet-error role="alert"></p>
      <footer class="sheet__foot">
        <button class="btn btn--ghost" type="button" data-sheet-close>취소</button>
        <button class="btn btn--primary" type="submit" data-sheet-save>저장</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/admin.js?v=1"></script>
</body>
</html>
